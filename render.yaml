# Render Blueprint (optional - you can also set these in the dashboard).
# The persistent disk at /var/data keeps the database, uploads and the
# session key across deploys. Disks need a paid instance type on Render.
services:
  - type: web
    name: africa-scholarbridge
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: DATABASE_PATH
        value: /var/data/scholarbridge.db
      - key: UPLOAD_ROOT
        value: /var/data/uploads
      - key: ADMIN_EMAIL
        value: africascholarbridge@gmail.com
      - key: MPESA_PHONE_NUMBER
        value: "0181785792"
      - key: VISA_APPLICATION_FEE
        value: "1500"
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      # Separate admin subdomain (OPTIONAL - set these in the Render dashboard
      # only AFTER admin.africascholarbridge.co.ke is added as a Custom Domain
      # on this service, its DNS CNAME points here and Render shows the
      # certificate as issued). Once set, /admin and /visa-admin answer only
      # on ADMIN_HOST and return 404 on the public website.
      # - key: ADMIN_HOST
      #   value: admin.africascholarbridge.co.ke
      # - key: PUBLIC_HOST
      #   value: africascholarbridge.co.ke
    disk:
      name: scholarbridge-data
      mountPath: /var/data
      sizeGB: 1
