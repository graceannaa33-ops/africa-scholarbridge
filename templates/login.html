{% extends "base.html" %}
{% block title %}Log In — Africa ScholarBridge{% endblock %}
{% block content %}
<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-lg-5">
      <div class="card asb-card shadow-sm">
        <div class="card-body p-4 p-md-5">
          <h2 class="fw-bold mb-1">Welcome Back</h2>
          <p class="text-muted mb-4">Log in to manage your annual funding application.</p>
          <form method="POST">
            <div class="mb-3">
              <label class="form-label">Email</label>
              <input type="email" name="email" class="form-control" placeholder="e.g. alex.test@example.com" required>
            </div>
            <div class="mb-3">
              <label class="form-label">Password</label>
              <input type="password" name="password" class="form-control" required>
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-semibold">Log In</button>
          </form>
          <p class="text-center text-muted mt-3 mb-0">New to Africa ScholarBridge? <a href="{{ url_for('register') }}">Create an account</a></p>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
